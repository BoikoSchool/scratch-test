<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест Scratch · 6 клас</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Liquid-glass look in plain CSS: soft colour blobs behind, translucent blurred cards on top; Scratch scripts sit on near-opaque white so blocks stay crisp. */
:root {
  --ink: #16203a; --muted: #55607a; --line: rgba(22,32,58,.10);
  --accent: #4f46e5; --accent2: #7c3aed; --accent-soft: rgba(79,70,229,.12);
  --ok: #16a34a; --ok-bg: rgba(22,163,74,.13); --bad: #dc2626; --bad-bg: rgba(220,38,38,.11);
  --glass: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.72); --glass-edge: rgba(255,255,255,.85);
  --solid: rgba(255,255,255,.9);
  --blur: blur(22px) saturate(180%);
  --shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 -1px 0 rgba(255,255,255,.25) inset, 0 10px 30px -8px rgba(30,41,90,.18), 0 2px 6px rgba(30,41,90,.06);
  --c-motion: #4C97FF; --c-looks: #9966FF; --c-events: #E6A800; --c-control: #FFAB19;
  --c-sensing: #5CB1D6; --c-operators: #59C059; --c-variables: #FF8C1A;
  --display: "Rubik", -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #eef2fb; }
html, body { margin: 0; }
body { color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; min-height: 100vh;
  background: radial-gradient(40vmax 40vmax at 8% 6%, #bcd3ff 0, transparent 60%), radial-gradient(38vmax 38vmax at 95% 18%, #e0c8ff 0, transparent 60%),
    radial-gradient(45vmax 45vmax at 85% 95%, #b5f0e0 0, transparent 60%), radial-gradient(36vmax 36vmax at 5% 90%, #ffe0b8 0, transparent 60%), #eef2fb;
  background-attachment: fixed; }
.wrap { max-width: 800px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 16px; }
.top { display: grid; gap: 10px; }
.eyebrow { font: 700 13px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(26px, 6vw, 38px)/1.1 var(--display); margin: 0; letter-spacing: -.02em; }
.glass { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-edge); box-shadow: var(--shadow); }
.progress { display: flex; gap: 5px; align-items: center; padding: 10px 16px; border-radius: 999px; position: sticky; top: 10px; z-index: 5;
  background: var(--glass-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-edge); box-shadow: var(--shadow); }
.dot { flex: 1; height: 8px; border-radius: 4px; background: rgba(22,32,58,.10); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.dot.now { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.lvl { font: 700 14px var(--display); color: var(--muted); white-space: nowrap; margin-left: 8px; }

.card { position: relative; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--glass-edge); border-radius: 24px; box-shadow: var(--shadow); }
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(160deg, rgba(255,255,255,.55) 0, rgba(255,255,255,0) 38%); }
.card > * { position: relative; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 20px 0; }
.qnum { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; height: 30px; padding: 0 10px; border-radius: 999px; color: #fff;
  font: 800 14px var(--display); background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 4px 10px -2px rgba(79,70,229,.45); }
.chip { font: 700 12.5px/1 var(--body); padding: 7px 11px; border-radius: 999px; color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset; }
.body { padding: 16px 20px 22px; display: grid; gap: 16px; }
.task { font: 700 21px/1.3 var(--display); margin: 0; letter-spacing: -.01em; }
.hint { margin: -8px 0 0; color: var(--muted); font-size: 15.5px; }
.script { overflow-x: auto; padding: 12px; background: var(--solid); border-radius: 18px; box-shadow: 0 1px 3px rgba(30,41,90,.08) inset; }
.script svg { display: block; max-width: none; }
.scripts { display: flex; flex-wrap: wrap; gap: 12px; }
.scripts .one { background: var(--solid); border-radius: 18px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; overflow-x: auto; box-shadow: 0 1px 3px rgba(30,41,90,.08) inset; }
.scripts .one b { font: 700 14px var(--display); color: var(--muted); }

.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.opt { font: 700 18px var(--display); padding: 14px; border-radius: 18px; border: 1px solid var(--glass-edge); background: rgba(255,255,255,.62); color: var(--ink);
  cursor: pointer; text-align: center; box-shadow: 0 1px 0 #fff inset; transition: transform .15s, box-shadow .15s; }
.opt:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 1px 0 #fff inset, 0 8px 18px -8px rgba(30,41,90,.3); }
.options.blocks { grid-template-columns: 1fr; }
.opt.block { display: flex; align-items: center; gap: 12px; text-align: left; overflow-x: auto; background: var(--solid); }
.opt.block .letter { font: 800 15px var(--display); color: var(--accent); flex: none; }
.opt.right { border-color: rgba(22,163,74,.7); background: rgba(225,247,233,.92); box-shadow: 0 0 0 3px rgba(22,163,74,.18); }
.opt.wrong { border-color: rgba(220,38,38,.6); background: rgba(253,232,230,.92); box-shadow: 0 0 0 3px rgba(220,38,38,.14); }
.opt:disabled { cursor: default; transform: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.stage { width: 100%; max-width: 480px; aspect-ratio: 4 / 3; background: #fff; border: 1px solid var(--glass-edge); border-radius: 18px; cursor: crosshair; display: block;
  box-shadow: 0 8px 22px -12px rgba(30,41,90,.35); }
.coords { font: 600 14px var(--body); color: var(--muted); }

.pool { display: flex; flex-wrap: wrap; gap: 10px; }
.piece { background: rgba(255,255,255,.7); border: 1.5px dashed rgba(79,70,229,.45); border-radius: 14px; padding: 6px; cursor: pointer; transition: transform .12s; }
.piece:hover:not(:disabled) { transform: translateY(-1px); border-style: solid; }
.piece:disabled { opacity: .25; cursor: default; }
.build { border: 1.5px dashed rgba(79,70,229,.5); border-radius: 18px; padding: 12px; min-height: 90px; background: var(--solid); overflow-x: auto; }
.empty { color: var(--muted); font-size: 15px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.numin { font: 700 22px var(--display); width: 150px; padding: 11px 16px; border-radius: 16px; border: 1px solid var(--glass-edge); background: rgba(255,255,255,.8); color: var(--ink);
  box-shadow: 0 1px 3px rgba(30,41,90,.12) inset; }
.numin:focus { outline: none; border-color: rgba(79,70,229,.6); box-shadow: 0 0 0 4px rgba(79,70,229,.18); }

.bugscript .sbc { cursor: pointer; }
.bugscript .sbc:hover > path:first-of-type { filter: brightness(1.12); }
.bugscript .pick-bad > path:first-of-type { stroke: var(--bad); stroke-width: 4; }
.bugscript .pick-ok > path:first-of-type { stroke: var(--ok); stroke-width: 4; }

.btn { font: 700 16px var(--display); border: 0; border-radius: 999px; padding: 13px 26px; cursor: pointer; color: #fff;
  background: linear-gradient(135deg, #3b82f6, #6d28d9);
  box-shadow: 0 1px 0 rgba(255,255,255,.45) inset, 0 -2px 0 rgba(0,0,0,.12) inset, 0 10px 22px -8px rgba(79,70,229,.6); transition: transform .15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.ghost { background: rgba(255,255,255,.7); color: var(--accent); border: 1px solid var(--glass-edge); box-shadow: 0 1px 0 #fff inset, 0 6px 16px -8px rgba(30,41,90,.3); }
.btn:disabled { opacity: .45; cursor: default; }

.feedback { border-radius: 18px; padding: 14px 16px; display: grid; gap: 6px; border: 1px solid var(--glass-edge); }
.feedback.ok { background: rgba(225,247,233,.85); } .feedback.bad { background: rgba(253,232,230,.85); }
.feedback strong { font: 800 18px var(--display); }
.feedback.ok strong { color: var(--ok); } .feedback.bad strong { color: var(--bad); }
.feedback p { margin: 0; }

.panel { padding: 28px 24px; display: grid; gap: 14px; }
.panel h2 { font: 800 28px/1.15 var(--display); margin: 0; letter-spacing: -.01em; }
.panel p { margin: 0; }
.field { display: grid; gap: 6px; }
.field label { font: 700 15px var(--body); color: var(--muted); }
.field input { font: 600 18px var(--body); padding: 12px 16px; border-radius: 16px; border: 1px solid var(--glass-edge); background: rgba(255,255,255,.8); color: var(--ink);

.field input:focus { outline: none; border-color: rgba(79,70,229,.6); box-shadow: 0 0 0 4px rgba(79,70,229,.18); }
.err { color: var(--bad); font-weight: 700; }
.levels { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.levels li { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 16px; background: rgba(255,255,255,.55); border: 1px solid var(--glass-edge); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: rgba(255,255,255,.6); border: 1px solid var(--glass-edge); border-radius: 18px; padding: 12px 14px; box-shadow: 0 1px 0 #fff inset; }
.stat span { display: block; font: 700 13px var(--body); color: var(--muted); }
.stat b { font: 800 24px var(--display); }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.endbtn { padding: 8px 16px; font-size: 14px; }
.overlay { position: fixed; inset: 0; background: rgba(20,28,55,.28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; z-index: 50; }
.overlay .card { max-width: 460px; width: 100%; background: rgba(255,255,255,.82); box-shadow: var(--shadow), 0 30px 60px -20px rgba(20,28,55,.45); }

.send { font-weight: 700; border-radius: 14px; padding: 11px 14px; }
.send:empty { display: none; }
.send.wait { background: var(--accent-soft); color: var(--accent); }
.send.ok { background: var(--ok-bg); color: var(--ok); }
.send.bad { background: var(--bad-bg); color: var(--bad); }
.card { animation: pop .22s cubic-bezier(.2,.9,.3,1.2); }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.985); } }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .card, .progress { background: rgba(255,255,255,.92); } }
@media (prefers-reduced-transparency: reduce) { .card, .progress { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 600px) { .card { border-radius: 20px; } .panel { padding: 22px 18px; } .big { width: 96px; height: 96px; font-size: 48px; } }

const CAT = { motion: ["Рух", "--c-motion"], looks: ["Вигляд", "--c-looks"], events: ["Події", "--c-events"],
  control: ["Керування", "--c-control"], sensing: ["Датчики", "--c-sensing"], operators: ["Оператори", "--c-operators"],
  variables: ["Змінні", "--c-variables"] };
const LEVELS = { 1: "Розминка", 2: "Змінні та умови", 3: "Справжній програміст", 4: "Бонус для найрозумніших" };
const SCALE = [[28, 12], [26, 11], [24, 10], [22, 9], [19, 8], [17, 7], [15, 6], [12, 5], [10, 4], [7, 3], [4, 2], [0, 1]];

function decode(b64, key) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
  return JSON.parse(new TextDecoder().decode(out));
}
const ALL = decode(BANK, KEY);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => (s || "").replace(/\s+/g, "").toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function render(code, scale = 0.8) {
  const doc = scratchblocks.parse(code, { languages: ["en", "uk"] });
  return scratchblocks.newView(doc, { style: "scratch3", scale }).render();
}

const S = { name: "", cls: "", start: 0, leaves: 0, active: false, level: 1, list: [], i: 0, res: {}, bonus: false };
const app = document.getElementById("app"), topEl = document.getElementById("top");

document.addEventListener("visibilitychange", () => { if (document.hidden && S.active) S.leaves++; });
window.addEventListener("beforeunload", e => { if (S.active) { e.preventDefault(); e.returnValue = ""; } });

function header(title, sub, dots) {
  topEl.innerHTML = `<div class="toprow"><span class="eyebrow">${sub}</span>${S.active ? `<button class="btn ghost endbtn" id="endbtn">Завершити тест</button>` : ""}</div><h1>${title}</h1>` + (dots || "");
  const eb = topEl.querySelector("#endbtn");
  if (eb) eb.addEventListener("click", askEnd);
}
function answeredMain() { return ALL.filter(q => q.level <= 3 && q.id in S.res).length; }
function askEnd() {
  if (document.querySelector(".overlay")) return;
  const left = 30 - answeredMain();
  const ov = el(`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="endq"><section class="card panel">
    <h2 id="endq">Завершити тест зараз?</h2>
    <p>${left > 0 ? `Ти ще не відповів на ${left} ${left % 10 >= 1 && left % 10 <= 4 && !(left % 100 >= 11 && left % 100 <= 14) ? "питання" : "питань"}. Вони не зарахуються, а результат одразу надішлеться вчителю.` : "Результат одразу надішлеться вчителю."}</p>
    <div class="row"><button class="btn" id="endyes">Так, завершити</button><button class="btn ghost" id="endno">Продовжити тест</button></div>
  </section></div>`);
  document.body.appendChild(ov);
  ov.querySelector("#endno").addEventListener("click", () => ov.remove());
  ov.querySelector("#endyes").addEventListener("click", () => { ov.remove(); showFinal(true); });
  ov.querySelector("#endno").focus();
}
function dotsFor(level) {
  const list = S.list;
  const d = list.map((q, k) => { const r = S.res[q.id]; return `<span class="dot ${r === true ? "ok" : r === false ? "bad" : k === S.i ? "now" : ""}"></span>`; }).join("");
  const lab = level === 4 ? "Бонус" : `Рівень ${level} з 3`;
  return `<div class="progress">${d}<span class="lvl">${lab}</span></div>`;
}

/* ---------- start ---------- */
function showStart() {
  header("Тест: програмування в Scratch", "6 клас");
  app.replaceChildren(el(`<section class="card panel">
    <h2>Привіт! Готовий перевірити себе?</h2>
    <ul class="levels">
      <li><b>Рівень 1</b><span>${LEVELS[1]} · 10 питань</span></li>
      <li><b>Рівень 2</b><span>${LEVELS[2]} · 10 питань</span></li>
      <li><b>Рівень 3</b><span>${LEVELS[3]} · 10 питань</span></li>
      <li><b>Бонус</b><span>5 складних питань для тих, хто хоче більше</span></li>
    </ul>
    <p>Після кожної відповіді побачиш пояснення. Повернутися до питання не можна, тож читай уважно.</p>
    <div class="field"><label for="nm">Ім'я та прізвище</label><input id="nm" autocomplete="off" placeholder="Наприклад, Оля Коваленко"></div>
    <div class="field"><label for="cl">Клас</label><input id="cl" autocomplete="off" placeholder="Наприклад, 6-А"></div>
    <p class="err" id="err" hidden>Впиши ім'я та клас, щоб почати.</p>
    <div class="row"><button class="btn" id="go">Почати тест</button></div>
  </section>`));
  const go = () => {
    const n = app.querySelector("#nm").value.trim(), c = app.querySelector("#cl").value.trim();
    if (!n || !c) { app.querySelector("#err").hidden = false; return; }
    S.name = n; S.cls = c; S.start = Date.now(); S.active = true; showLevel(1);
  };
  app.querySelector("#go").addEventListener("click", go);
  app.querySelectorAll("input").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); go(); } }));
}

function showLevel(level) {
  S.level = level; S.list = shuffle(ALL.filter(q => q.level === level)); S.i = 0;
  header(level === 4 ? "Бонусний рівень" : `Рівень ${level}`, level === 4 ? "5 складних питань" : "10 питань");
  app.replaceChildren(el(`<section class="card panel">
    <span class="eyebrow">${level === 4 ? "Бонус" : `Рівень ${level} з 3`}</span>
    <h2>${LEVELS[level]}</h2>
    <p>${level === 4 ? "Ці питання складніші за всі попередні. Не поспішай і простеж скрипт крок за кроком." : level === 1 ? "Почнемо з простого." : "Чудово, рухаємося далі!"}</p>
    <div class="row"><button class="btn" id="go">Почати</button></div>
  </section>`));
  app.querySelector("#go").addEventListener("click", showQuestion);
  app.querySelector("#go").focus();
}

/* ---------- question ---------- */
function showQuestion() {
  const q = S.list[S.i];
  header(LEVELS[S.level], `Питання ${S.i + 1} з ${S.list.length}`, dotsFor(S.level));
  const chips = q.cats.map(c => `<span class="chip" style="background:var(${CAT[c][1]})">${CAT[c][0]}</span>`).join("");
  const card = el(`<section class="card">
    <div class="strip"><span class="qnum">${S.i + 1}/${S.list.length}</span>${chips}</div>
    <div class="body"><h2 class="task">${esc(q.task)}</h2>${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : ""}<div class="area"></div><div class="fb"></div></div>
  </section>`);
  app.replaceChildren(card);
  const area = card.querySelector(".area");
  ({ choice: mkChoice, blockchoice: mkChoice, stage: mkStage, build: mkBuild, bug: mkBug, number: mkNumber })[q.type](q, area);
  window.scrollTo({ top: 0 });
}

function scriptsOf(q, area) {
  if (q.scripts) {
    const box = el(`<div class="scripts"></div>`);
    q.scripts.forEach(s => { const o = el(`<div class="one"><b>${esc(s.label)}</b></div>`); o.appendChild(render(s.code)); box.appendChild(o); });
    area.appendChild(box);
  } else if (q.script) { const d = el(`<div class="script"></div>`); d.appendChild(render(q.script)); area.appendChild(d); }
}

function finish(q, ok) {
  S.res[q.id] = ok;
  topEl.querySelector(".progress").outerHTML = dotsFor(S.level);
  const fb = app.querySelector(".fb");
  const last = S.i === S.list.length - 1;
  fb.replaceChildren(el(`<div class="feedback ${ok ? "ok" : "bad"}" role="status"><strong>${ok ? "Правильно!" : "Не зовсім."}</strong><p>${esc(ok ? q.ok : q.bad)}</p></div>`));
  const b = el(`<div class="row"><button class="btn">${last ? "Далі" : "Наступне питання"}</button></div>`);
  fb.appendChild(b);
  b.firstChild.addEventListener("click", () => {
    if (!last) { S.i++; showQuestion(); }
    else if (S.level < 3) showLevel(S.level + 1);
    else if (S.level === 3) showBonusOffer();
    else showFinal();
  });
  b.firstChild.focus({ preventScroll: true });
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function mkChoice(q, area) {
  scriptsOf(q, area);
  const blocks = q.type === "blockchoice";
  const order = shuffle(q.options.map((_, k) => k));
  const box = el(`<div class="options ${blocks ? "blocks" : ""}"></div>`);
  const btns = [];
  order.forEach((k, pos) => {
    const b = el(blocks ? `<button class="opt block"><span class="letter">${"АБВГД"[pos]}</span></button>` : `<button class="opt">${esc(q.options[k])}</button>`);
    if (blocks) { b.appendChild(render(q.options[k], 0.72)); b.setAttribute("aria-label", "Варіант " + "АБВГД"[pos]); }
    b.addEventListener("click", () => {
      btns.forEach(x => x.disabled = true);
      const ok = k === q.answer;
      b.classList.add(ok ? "right" : "wrong");
      btns[order.indexOf(q.answer)].classList.add("right");
      finish(q, ok);
    });
    btns.push(b); box.appendChild(b);
  });
  area.appendChild(box);
}

function mkNumber(q, area) {
  scriptsOf(q, area);
  const row = el(`<div class="row"><input class="numin" id="num" inputmode="numeric" autocomplete="off" aria-label="Твоя відповідь"><button class="btn" disabled>Перевірити</button></div>`);
  const inp = row.querySelector("input"), btn = row.querySelector("button");
  inp.addEventListener("input", () => btn.disabled = !inp.value.trim());
  const check = () => {
    if (!inp.value.trim()) return;
    inp.disabled = btn.disabled = true;
    const v = parseFloat(inp.value.replace(",", ".").replace(/\s/g, ""));
    const ok = v === q.answer;
    inp.style.borderColor = ok ? "var(--ok)" : "var(--bad)";
    finish(q, ok);
  };
  btn.addEventListener("click", check);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
  area.appendChild(row);
  inp.focus();
}

function mkStage(q, area) {
  scriptsOf(q, area);
  const box = el(`<div style="display:grid;gap:8px">
    <svg class="stage" viewBox="-240 -180 480 360" role="img" aria-label="Сцена з координатною сіткою"></svg>
    <div class="row"><button class="btn" disabled>Перевірити</button><span class="coords">Клацни на сцені, щоб поставити точку</span></div></div>`);
  area.appendChild(box);
  const svg = box.querySelector("svg"), btn = box.querySelector("button"), coords = box.querySelector(".coords");
  const T = (x, y, s, extra = "") => `<text x="${x}" y="${y}" font-size="13" fill="#5B6386" font-family="Nunito, sans-serif" ${extra}>${s}</text>`;
  let g = "";
  for (let x = -200; x <= 200; x += 50) g += `<line x1="${x}" y1="-180" x2="${x}" y2="180" stroke="#E6E9F3" stroke-width="1.5"/>`;
  for (let y = -150; y <= 150; y += 50) g += `<line x1="-240" y1="${y}" x2="240" y2="${y}" stroke="#E6E9F3" stroke-width="1.5"/>`;
  g += `<line x1="-240" y1="0" x2="240" y2="0" stroke="#9AA2C2" stroke-width="2"/><line x1="0" y1="-180" x2="0" y2="180" stroke="#9AA2C2" stroke-width="2"/>`;
  for (let x = -200; x <= 200; x += 50) if (x) g += T(x, 16, x, 'text-anchor="middle"');
  for (let y = -150; y <= 150; y += 50) if (y) g += T(6, -y + 4, y);
  g += T(228, -6, "x", 'text-anchor="end" font-weight="700" font-size="15"') + T(8, -164, "y", 'font-weight="700" font-size="15"');
  const [sx, sy] = q.start;
  g += `<circle cx="${sx}" cy="${-sy}" r="9" fill="#FFAB19" stroke="#B36B00" stroke-width="2"/>` + T(sx - 12, -sy - 14, "старт", 'text-anchor="end" fill="#B36B00" font-weight="700" font-size="12"');
  g += `<g class="mark"></g><g class="truth"></g>`;
  svg.innerHTML = g;
  let pick = null, done = false;
  svg.addEventListener("click", e => {
    if (done) return;
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const s = p.matrixTransform(svg.getScreenCTM().inverse());
    pick = [Math.round(s.x), Math.round(-s.y)];
    svg.querySelector(".mark").innerHTML = `<circle cx="${s.x}" cy="${s.y}" r="10" fill="#4C3FD1" fill-opacity=".85" stroke="#fff" stroke-width="2"/>`;
    coords.textContent = `Твоя точка: x: ${pick[0]}, y: ${pick[1]}`;
    btn.disabled = false;
  });
  btn.addEventListener("click", () => {
    done = true; btn.disabled = true; svg.style.cursor = "default";
    const [tx, ty] = q.target;
    svg.querySelector(".truth").innerHTML = `<circle cx="${tx}" cy="${-ty}" r="12" fill="none" stroke="#1F8A4C" stroke-width="4"/>` + T(tx + 16, -ty + 5, `x: ${tx}, y: ${ty}`, 'fill="#1F8A4C" font-weight="800" font-size="14"');
    finish(q, Math.hypot(pick[0] - tx, pick[1] - ty) <= q.tol);
  });
}

function buildCode(q, ids) {
  const out = []; let depth = 0;
  ids.forEach(id => { const p = q.pieces.find(x => x.id === id); out.push(p.code); if (p.c) depth++; });
  for (let k = 0; k < depth; k++) out.push("end");
  return out.join("\n");
}
function mkBuild(q, area) {
  const pool = el(`<div class="pool"></div>`);
  const build = el(`<div class="build"><span class="empty">Тут з'явиться твій скрипт</span></div>`);
  const ctr = el(`<div class="row"><button class="btn">Перевірити</button><button class="btn ghost">Почати спочатку</button></div>`);
  const [check, reset] = ctr.querySelectorAll("button");
  const order = [];
  const need = q.correct[0].length;
  check.disabled = true;
  shuffle(q.pieces).forEach(p => {
    const b = el(`<button class="piece"></button>`);
    b.appendChild(render(p.c ? p.code + "\nend" : p.code, 0.7));
    b.setAttribute("aria-label", p.code.replace("@greenFlag", "прапорець"));
    b.addEventListener("click", () => { order.push(p.id); b.disabled = true; redraw(); });
    pool.appendChild(b);
  });
  function redraw() {
    build.replaceChildren(order.length ? render(buildCode(q, order), 0.8) : el(`<span class="empty">Тут з'явиться твій скрипт</span>`));
    check.disabled = order.length < need;
  }
  reset.addEventListener("click", () => { order.length = 0; pool.querySelectorAll("button").forEach(b => b.disabled = false); redraw(); });
  check.addEventListener("click", () => {
    check.disabled = reset.disabled = true;
    pool.querySelectorAll("button").forEach(b => b.disabled = true);
    const ok = q.correct.some(c => c.join() === order.join());
    build.style.borderColor = ok ? "var(--ok)" : "var(--bad)";
    if (!ok) {
      const right = el(`<div class="build" style="border-color:var(--ok)"><p class="hint" style="margin:0 0 6px">Правильний скрипт:</p></div>`);
      right.appendChild(render(buildCode(q, q.correct[0]), 0.8));
      build.after(right);
    }
    finish(q, ok);
  });
  area.append(pool, build, ctr);
}

function mkBug(q, area) {
  const box = el(`<div class="script bugscript"></div>`);
  const svg = render(q.script, 0.85);
  box.appendChild(svg); area.appendChild(box);
  const isBlock = g => {
    const p = g.querySelector(":scope > path");
    if (!p) return false;
    const c = p.getAttribute("class") || "";
    return /sb3-(motion|looks|control|variables|events|sensing|operators)/.test(c) && !/literal|input/.test(c);
  };
  const blocks = [...svg.querySelectorAll("g")].filter(isBlock);
  const owner = n => { while (n && n !== svg) { if (blocks.includes(n)) return n; n = n.parentNode; } return null; };
  const own = g => norm([...g.querySelectorAll("text")].filter(t => owner(t) === g).map(t => t.textContent).join(""));
  const isBug = g => q.bug.some(b => own(g) === norm(b));
  blocks.forEach(g => g.classList.add("sbc"));
  let done = false;
  svg.addEventListener("click", e => {
    if (done) return;
    const g = owner(e.target); if (!g) return;
    done = true;
    const ok = isBug(g);
    g.classList.add(ok ? "pick-ok" : "pick-bad");
    if (!ok) blocks.filter(isBug).forEach(x => x.classList.add("pick-ok"));
    blocks.forEach(x => x.classList.remove("sbc"));
    finish(q, ok);
  });
}

/* ---------- bonus offer & final ---------- */
function mainScore() { return ALL.filter(q => q.level <= 3 && S.res[q.id]).length; }
function showBonusOffer() {
  header("Основну частину завершено!", "30 питань позаду");
  app.replaceChildren(el(`<section class="card panel">
    <h2>Хочеш спробувати бонус?</h2>
    <p>Це 5 найскладніших питань для тих, хто хоче перевірити себе по-справжньому. Бонус не зменшить твою оцінку.</p>
    <div class="row"><button class="btn" id="yes">Так, спробую</button><button class="btn ghost" id="no">Ні, завершити тест</button></div>
  </section>`));
  app.querySelector("#yes").addEventListener("click", () => { S.bonus = true; showLevel(4); });
  app.querySelector("#no").addEventListener("click", showFinal);
}

function gradeOf(n) { return SCALE.find(([min]) => n >= min)[1]; }
function levelScore(l) { return ALL.filter(q => q.level === l && S.res[q.id]).length; }

function showFinal(early) {
  S.active = false;
  const answered = answeredMain();
  const bonusDone = ALL.filter(q => q.level === 4 && q.id in S.res).length;
  const total = mainScore(), grade = gradeOf(total);
  const minutes = Math.round((Date.now() - S.start) / 6000) / 10;
  const bonusTxt = S.bonus ? `${levelScore(4)} з 5` + (bonusDone < 5 ? ` (відповів на ${bonusDone})` : "") : "не проходив";
  const wrong = l => ALL.filter(q => q.level === l && S.res[q.id] === false).map(q => `${q.id} ${q.short}`);
  const mainWrong = [1, 2, 3].flatMap(wrong);
  const details = (answered < 30 ? `Завершено достроково: відповів на ${answered} з 30 | ` : "") + (mainWrong.length ? "Помилки: " + mainWrong.join("; ") : "Без помилок в основній частині") +
    (S.bonus ? " | Бонус, помилки: " + (wrong(4).join("; ") || "немає") : "");
  const data = { name: S.name, cls: S.cls, grade, total, l1: `${levelScore(1)} з 10`, l2: `${levelScore(2)} з 10`, l3: `${levelScore(3)} з 10`,
    bonus: bonusTxt, minutes, leaves: S.leaves, details };

  header("Тест завершено!", esc(S.name) + " · " + esc(S.cls));
  const card = el(`<section class="card panel">
    <span class="eyebrow">Твоя оцінка</span>
    <div class="big">${grade}</div>
    ${answered < 30 ? `<p>Ти відповів на ${answered} з 30 питань.</p>` : ""}
    <div class="stats">
      <div class="stat"><span>Правильних відповідей</span><b>${total} з 30</b></div>
      <div class="stat"><span>Рівень 1</span><b>${data.l1}</b></div>
      <div class="stat"><span>Рівень 2</span><b>${data.l2}</b></div>
      <div class="stat"><span>Рівень 3</span><b>${data.l3}</b></div>
      ${S.bonus ? `<div class="stat"><span>Бонус</span><b>${bonusTxt}</b></div>` : ""}
    </div>
    <div class="send" id="send"></div>
    <div class="row" id="dlrow" hidden><button class="btn ghost" id="dl">Завантажити файл результату</button></div>
  </section>`);
  app.replaceChildren(card);
  card.querySelector("#dl").addEventListener("click", () => {
    const txt = `Тест Scratch, 6 клас\nІм'я: ${S.name}\nКлас: ${S.cls}\nДата: ${new Date().toLocaleString("uk-UA")}\nОцінка: ${grade}\nПравильних: ${total} з 30\nРівень 1: ${data.l1}\nРівень 2: ${data.l2}\nРівень 3: ${data.l3}\nБонус: ${bonusTxt}\n${details}\n`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain;charset=utf-8" }));
    a.download = `Scratch_${S.name.replace(/\s+/g, "_")}.txt`; a.click();
  });
  const st = card.querySelector("#send"), dlrow = card.querySelector("#dlrow");
  if (!SHEET_URL.startsWith("https://")) { dlrow.hidden = false; return; }
  const send = () => {
    st.className = "send wait"; st.textContent = "Надсилаю результат учителю…";
    fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(data) })
      .then(() => { st.className = "send ok"; st.textContent = "✔ Результат надіслано вчителю."; })
      .catch(() => {
        st.className = "send bad"; st.textContent = "Не вдалося надіслати результат. Перевір інтернет. ";
        const r = el(`<button class="btn ghost" style="padding:6px 14px">Спробувати ще раз</button>`);
        r.addEventListener("click", send); st.appendChild(r); dlrow.hidden = false;
      });
  };
  send();
}

showStart();
</script>
